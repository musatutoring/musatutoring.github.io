<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Musa Tutoring</title>
    <script>
      // GitHub Pages serves this file for any address it does not recognise.
      // It hands the address back to the website so pages like /pathways load
      // correctly. Works together with the matching script in index.html.
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/?/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
