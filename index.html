    <!--
      Tells Google this is a real local business serving specific suburbs.
      Keep the areaServed list in step with src/content/site.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Musa Tutoring",
        "url": "https://musatutoring.org/",
        "logo": "https://musatutoring.org/icon-512.png",
        "image": "https://musatutoring.org/og-image.png",
        "description": "The Delta Program: a 12-week one-to-one math program for middle school and high school students, delivered online to Twin Cities families.",
        "telephone": "+1-612-234-1270",
        "email": "info@musatutoring.org",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Minnetonka",
          "addressRegion": "MN",
          "addressCountry": "US"
        },
        "areaServed": [
          { "@type": "City", "name": "Minnetonka" },
          { "@type": "City", "name": "Hopkins" },
          { "@type": "City", "name": "Eden Prairie" },
          { "@type": "City", "name": "St. Louis Park" },
          { "@type": "City", "name": "Minneapolis" },
          { "@type": "City", "name": "St. Paul" }
        ]
      }
    </script>

    <!--
      Makes deep links like /pathways work on GitHub Pages.
      Works together with public/404.html. Do not remove either one.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
